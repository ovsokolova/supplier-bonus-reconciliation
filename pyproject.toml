[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "supplier-bonus-reconciliation"
version = "0.1.0"
description = "Автоматическая сверка взаиморасчётов и бонусов поставщиков"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "rapidfuzz>=3.9",
    "pydantic>=2.7",
    "streamlit>=1.36",
    "openpyxl>=3.1",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
extraction = [
    "pytesseract>=0.3.10",
    "paddleocr>=2.7",
    "pdfplumber>=0.11",
]
llm = [
    "ollama>=0.3",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "black>=24.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-requests",
    "reportlab>=4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
strict_equality = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
ignore_missing_imports = true
exclude = ["tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=supplier_bonus --cov-report=term-missing"